name: Build ShiftNote Test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ShiftNote_RC2_GitHub_RootReady.zip'
      - '.github/workflows/android-debug-apk.yml'
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
      - name: Extract submitted ShiftNote source
        shell: bash
        run: |
          if [ -f ShiftNote_RC2_GitHub_RootReady.zip ]; then
            python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          archive = Path("ShiftNote_RC2_GitHub_RootReady.zip")
          with ZipFile(archive) as z:
              assert z.testzip() is None, "ZIP CRC check failed"
              for info in z.infolist():
                  if info.is_dir(): continue
                  p = Path(info.filename)
                  assert not p.is_absolute() and ".." not in p.parts, "Unsafe ZIP path"
                  target = Path.cwd() / p
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          assert Path("app/build.gradle").is_file()
          assert Path("settings.gradle").is_file()
          print("Android project extracted")
          PY
          fi
          test -f app/build.gradle || (echo "Missing Android project; upload ShiftNote_RC2_GitHub_RootReady.zip to repo root" && exit 1)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || [[ "${PIPESTATUS[1]}" == "0" ]]
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable AndroidX in Gradle
        shell: bash
        run: |
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\n' >> gradle.properties
      - name: Run tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShiftNoteNext-1.2.0-rc2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
